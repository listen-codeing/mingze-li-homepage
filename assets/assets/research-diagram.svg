<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Research diagram</title>
  <desc id="desc">A simple visual map connecting prediction, optimization, scheduling, and applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1eee6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#183430" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="18" fill="url(#bg)"/>
  <path d="M118 278C196 108 414 87 562 204s74 231-82 244-328 1-362-170z" fill="#dff1ee" opacity=".72"/>
  <g fill="none" stroke="#0d766e" stroke-width="4" opacity=".55">
    <path d="M180 264 C270 180, 376 182, 474 252"/>
    <path d="M266 354 C338 300, 436 306, 532 374"/>
    <path d="M286 178 C332 258, 332 314, 300 402"/>
    <path d="M512 164 C474 246, 464 322, 502 418"/>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(92 216)">
      <rect width="176" height="98" rx="12" fill="#fffdf8" stroke="#ddd7cc"/>
      <text x="24" y="40" fill="#0d766e" font-size="18" font-weight="800">Prediction</text>
      <text x="24" y="68" fill="#687169" font-size="14">data-driven signals</text>
    </g>
    <g transform="translate(286 104)">
      <rect width="188" height="104" rx="12" fill="#fffdf8" stroke="#ddd7cc"/>
      <text x="24" y="42" fill="#0d766e" font-size="18" font-weight="800">Optimization</text>
      <text x="24" y="70" fill="#687169" font-size="14">robust decisions</text>
    </g>
    <g transform="translate(492 236)">
      <rect width="178" height="102" rx="12" fill="#fffdf8" stroke="#ddd7cc"/>
      <text x="24" y="40" fill="#0d766e" font-size="18" font-weight="800">Scheduling</text>
      <text x="24" y="68" fill="#687169" font-size="14">time and resources</text>
    </g>
    <g transform="translate(248 338)">
      <rect width="230" height="106" rx="12" fill="#0d766e"/>
      <text x="24" y="43" fill="#ffffff" font-size="18" font-weight="800">Applications</text>
      <text x="24" y="72" fill="#dff1ee" font-size="14">logistics, mobility, energy</text>
    </g>
  </g>
  <circle cx="612" cy="110" r="34" fill="#b77728" opacity=".2"/>
  <circle cx="122" cy="400" r="24" fill="#0d766e" opacity=".18"/>
</svg>
